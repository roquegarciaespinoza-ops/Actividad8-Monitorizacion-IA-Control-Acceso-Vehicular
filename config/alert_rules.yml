groups:
  - name: vehicle-access-simulator
    rules:
      - alert: VehicleSimulatorHighErrorRate
        expr: sum(rate(vehicle_requests_total{status="error"}[5m])) / clamp_min(sum(rate(vehicle_requests_total[5m])), 0.001) > 0.01
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Más del 1% de solicitudes sintéticas con error"
          runbook: "docs/05_runbooks.md"
      - alert: VehicleSimulatorHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(vehicle_inference_seconds_bucket[5m]))) > 2
        for: 2m
        labels:
          severity: warning
          incident_priority: P2
        annotations:
          summary: "Latencia p95 del simulador superior a 2 segundos"
          runbook: "docs/05_runbooks.md"
